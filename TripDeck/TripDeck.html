<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripDeck — Proposal Studio · Tripclap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: "Inter", sans-serif; background: #0C1A12; color: #111827; -webkit-font-smoothing: antialiased; }
    input, textarea, select, button { font-family: "Inter", sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="NewProposal.jsx"></script>
  <script type="text/babel" src="AllProposals.jsx"></script>
  <script type="text/babel" src="Clients.jsx"></script>
  <script type="text/babel" src="Products.jsx"></script>
  <script type="text/babel" src="Settings.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#1cca73",
  "sidebarDark": false,
  "density": "spacious"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweakState] = React.useState(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState("dashboard");
  const [newProposalClient, setNewProposalClient] = React.useState(null);
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [searchQuery, setSearchQuery] = React.useState("");
  const searchRef = React.useRef(null);

  // ⌘K shortcut
  React.useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setSearchOpen(true); setSearchQuery(""); }
      if (e.key === "Escape") setSearchOpen(false);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  React.useEffect(() => {
    if (searchOpen) setTimeout(() => searchRef.current?.focus(), 50);
  }, [searchOpen]);

  const searchResults = React.useMemo(() => {
    const q = searchQuery.toLowerCase().trim();
    if (!q) return [];
    const results = [];
    CLIENTS.forEach(c => {
      if (c.agency.toLowerCase().includes(q) || c.contact.toLowerCase().includes(q) || c.city.toLowerCase().includes(q)) {
        results.push({ type: "client", label: c.agency, sub: `${c.contact} · ${c.city}`, id: c.id });
      }
    });
    PROPOSALS.forEach(p => {
      if (p.id.toLowerCase().includes(q) || p.client.toLowerCase().includes(q) || p.products.join(" ").toLowerCase().includes(q)) {
        results.push({ type: "proposal", label: p.id, sub: `${p.client} · ${p.status} · ${formatINR(p.amount)}`, id: p.id });
      }
    });
    PRODUCTS.forEach(prod => {
      if (prod.name.toLowerCase().includes(q) || prod.description.toLowerCase().includes(q)) {
        results.push({ type: "product", label: prod.name, sub: prod.description, id: prod.id });
        prod.plans.forEach(pl => {
          if (pl.name.toLowerCase().includes(q) || pl.description.toLowerCase().includes(q)) {
            results.push({ type: "plan", label: `${prod.name} — ${pl.name}`, sub: `${pl.description} · ${formatINR(pl.mrp)}/mo`, id: pl.id });
          }
        });
      }
    });
    return results.slice(0, 10);
  }, [searchQuery]);

  const typeIcon = (type) => ({
    client: { icon: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z", color: "#3B82F6", bg: "#EFF6FF" },
    proposal: { icon: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z", color: "#1D9E75", bg: "#E1F5EE" },
    product: { icon: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4", color: "#8B5CF6", bg: "#F5F3FF" },
    plan: { icon: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2", color: "#F59E0B", bg: "#FFFBEB" },
  }[type]);

  const handleResultClick = (result) => {
    setSearchOpen(false);
    if (result.type === "client") setScreen("clients");
    else if (result.type === "proposal") setScreen("all-proposals");
    else if (result.type === "product" || result.type === "plan") setScreen("products");
  };

  const setTweak = (key, value) => {
    const edits = typeof key === "object" ? key : { [key]: value };
    setTweakState(p => ({ ...p, ...edits }));
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
  };

  // Tweaks panel protocol
  const [showTweaks, setShowTweaks] = React.useState(false);
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setShowTweaks(true);
      if (e.data?.type === "__deactivate_edit_mode") setShowTweaks(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const sidebarBg = tweaks.sidebarDark ? "#0C1A12" : "#fff";
  const accent = tweaks.accentColor;

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      <Sidebar screen={screen} setScreen={setScreen} setNewProposalClient={setNewProposalClient} />

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, overflow: "hidden" }}>
        {/* Top bar */}
        <div style={{ height: 52, background: "#fff", borderBottom: "1px solid #E5E7EB", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 28px", flexShrink: 0 }}>
          <div style={{ fontSize: 13, color: "#9CA3AF" }}>
            {screen === "dashboard" && "Dashboard"}
            {screen === "new-proposal" && "New Proposal"}
            {screen === "all-proposals" && "All Proposals"}
            {screen === "clients" && "Clients"}
            {screen === "products" && "Products & Plans"}
            {screen === "settings" && "Settings"}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            {/* Search */}
            <div onClick={() => { setSearchOpen(true); setSearchQuery(""); }} style={{ display: "flex", alignItems: "center", gap: 8, background: "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 8, padding: "6px 12px", cursor: "pointer", transition: "border-color 0.15s" }}
              onMouseEnter={e => e.currentTarget.style.borderColor = "#1D9E75"}
              onMouseLeave={e => e.currentTarget.style.borderColor = "#E5E7EB"}>
              <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth={2}><circle cx={11} cy={11} r={8}/><path d="M21 21l-4.35-4.35"/></svg>
              <span style={{ fontSize: 12, color: "#9CA3AF" }}>Quick search…</span>
              <span style={{ fontSize: 10, color: "#D1D5DB", border: "1px solid #E5E7EB", borderRadius: 4, padding: "1px 5px" }}>⌘K</span>
            </div>
            {/* Notif */}
            <button style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid #E5E7EB", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", position: "relative" }}>
              <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="#6B7280" strokeWidth={2}><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
              <div style={{ position: "absolute", top: 6, right: 6, width: 7, height: 7, borderRadius: "50%", background: "#EF4444", border: "1.5px solid #fff" }}></div>
            </button>
            {/* Avatar */}
            <div style={{ width: 32, height: 32, borderRadius: "50%", background: "#1D9E75", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff", cursor: "pointer" }}>
              AB
            </div>
          </div>
        </div>

        {/* Screen content */}
        <div style={{ flex: 1, overflow: "hidden", display: "flex" }}>
          {screen === "dashboard" && <Dashboard setScreen={setScreen} />}
          {screen === "new-proposal" && <NewProposal initialClient={newProposalClient ? { agency: newProposalClient.agency, contact: newProposalClient.contact, email: newProposalClient.email, phone: newProposalClient.phone, city: newProposalClient.city, state: newProposalClient.state, gst: newProposalClient.gst, notes: "" } : null} />}
          {screen === "all-proposals" && <AllProposals setScreen={setScreen} />}
          {screen === "clients" && <Clients setScreen={setScreen} setNewProposalClient={setNewProposalClient} />}
          {screen === "products" && <Products />}
          {screen === "settings" && <Settings />}
        </div>
      </div>

      {/* Universal Search Modal */}
      {searchOpen && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "flex-start", justifyContent: "center", zIndex: 2000, paddingTop: 120 }}
          onClick={() => setSearchOpen(false)}>
          <div style={{ background: "#fff", borderRadius: 14, width: 580, boxShadow: "0 32px 64px rgba(0,0,0,0.2)", overflow: "hidden" }}
            onClick={e => e.stopPropagation()}>
            {/* Input */}
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "16px 20px", borderBottom: searchResults.length > 0 || searchQuery ? "1px solid #E5E7EB" : "none" }}>
              <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth={2}><circle cx={11} cy={11} r={8}/><path d="M21 21l-4.35-4.35"/></svg>
              <input ref={searchRef} value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                placeholder="Search clients, proposals, products…"
                style={{ flex: 1, border: "none", outline: "none", fontSize: 15, color: "#111827", background: "transparent", fontFamily: "Inter, sans-serif" }} />
              {searchQuery && (
                <button onClick={() => setSearchQuery("")} style={{ background: "none", border: "none", cursor: "pointer", color: "#9CA3AF", fontSize: 18, lineHeight: 1, padding: 0 }}>×</button>
              )}
              <span style={{ fontSize: 11, color: "#D1D5DB", border: "1px solid #E5E7EB", borderRadius: 5, padding: "2px 7px" }}>Esc</span>
            </div>

            {/* Empty state */}
            {!searchQuery && (
              <div style={{ padding: "20px 24px" }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 12 }}>Quick Jump</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {[["Clients","clients","#3B82F6"],["All Proposals","all-proposals","#1D9E75"],["Products & Plans","products","#8B5CF6"],["New Proposal","new-proposal","#F59E0B"]].map(([label, sc, color]) => (
                    <button key={sc} onClick={() => { setScreen(sc); setSearchOpen(false); }}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", background: "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 8, fontSize: 13, cursor: "pointer", color: "#374151", fontFamily: "Inter, sans-serif" }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: color }}></div>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Results */}
            {searchQuery && searchResults.length === 0 && (
              <div style={{ padding: "28px 24px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
                No results for "<strong style={{ color: "#374151" }}>{searchQuery}</strong>"
              </div>
            )}
            {searchResults.length > 0 && (
              <div style={{ maxHeight: 380, overflowY: "auto" }}>
                {["client","proposal","product","plan"].map(type => {
                  const group = searchResults.filter(r => r.type === type);
                  if (!group.length) return null;
                  const ti = typeIcon(type);
                  const groupLabel = { client: "Clients", proposal: "Proposals", product: "Products", plan: "Plans" }[type];
                  return (
                    <div key={type}>
                      <div style={{ padding: "10px 20px 6px", fontSize: 10, fontWeight: 700, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: "0.6px" }}>{groupLabel}</div>
                      {group.map((result, i) => (
                        <div key={i} onClick={() => handleResultClick(result)}
                          style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 20px", cursor: "pointer", transition: "background 0.1s" }}
                          onMouseEnter={e => e.currentTarget.style.background = "#F9FAFB"}
                          onMouseLeave={e => e.currentTarget.style.background = ""}>
                          <div style={{ width: 34, height: 34, borderRadius: 8, background: ti.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                            <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={ti.color} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"><path d={ti.icon}/></svg>
                          </div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: "#111827" }}>{result.label}</div>
                            <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{result.sub}</div>
                          </div>
                          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" strokeWidth={2}><path d="M9 18l6-6-6-6"/></svg>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}

            {/* Footer */}
            <div style={{ padding: "10px 20px", borderTop: "1px solid #F3F4F6", display: "flex", gap: 16, background: "#FAFAFA" }}>
              {[["↵","to select"],["↑↓","to navigate"],["Esc","to close"]].map(([key, label]) => (
                <div key={key} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "#9CA3AF" }}>
                  <span style={{ border: "1px solid #E5E7EB", borderRadius: 4, padding: "1px 6px", fontSize: 11, color: "#6B7280", background: "#fff" }}>{key}</span>
                  {label}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Tweaks Panel */}
      {showTweaks && (
        <TweaksPanel onClose={() => { setShowTweaks(false); window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*"); }}>
          <TweakSection title="Appearance">
            <TweakColor label="Accent color" value={tweaks.accentColor} onChange={v => setTweak("accentColor", v)} />
            <TweakToggle label="Dark sidebar" value={tweaks.sidebarDark} onChange={v => setTweak("sidebarDark", v)} />
            <TweakRadio label="Density" value={tweaks.density} options={["compact","comfortable","spacious"]} onChange={v => setTweak("density", v)} />
          </TweakSection>
          <TweakSection title="Quick Navigate">
            <TweakButton label="→ Dashboard" onClick={() => setScreen("dashboard")} />
            <TweakButton label="→ New Proposal" onClick={() => setScreen("new-proposal")} />
            <TweakButton label="→ All Proposals" onClick={() => setScreen("all-proposals")} />
            <TweakButton label="→ Clients" onClick={() => setScreen("clients")} />
            <TweakButton label="→ Products & Plans" onClick={() => setScreen("products")} />
            <TweakButton label="→ Settings" onClick={() => setScreen("settings")} />
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
